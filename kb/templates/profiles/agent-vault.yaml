# Starter profile: agent-vault (designs, agent sessions, project records). Internal material only,
# plus external sources about agent tooling when you want to cite them.
schema: 4
name: agent-vault
description: "Why my projects are the way they are: designs, agent sessions, project records."
access: shared
tiers: [official, primary, secondary, community, vendor, synthetic]
tags: {}                  # controlled vocabulary, name: "meaning"; add deliberately with `kb tags add`
inbox: {max_age: 7d}
caps: {warn_mb: 10, max_mb: 25}
sessions:
  exclude: []             # paths whose sessions are never ingested (local vaults are always skipped)

types:
  design:                 # a design doc; status: implemented once built (then it is rationale, not current behaviour)
    folder: designs
    origin: internal
    role: synthesis
    keys:
      project: link
      implemented_in: list   # e.g. ["llms@abc1234..def5678"]
      supersedes: links

  project:                # one per project or tool
    folder: projects
    origin: internal
    role: synthesis
    keys:
      repo: string
      owner: [personal, club, school, work, third-party]
      designs: links
      kb: string             # the domain vault name, if it has one

  session:                # an agent session (generated by kb sessions ingest)
    folder: sessions
    origin: internal
    original: immutable      # raw transcript stays out of git; original_note records its path and sha256
    text: extracted
    quotes: verbatim
    role: input
    keys:
      tool: [claude, codex]
      session_id: string
      started: string
      ended: string
      cwd: string
      repo: string
      model: string
      commits: list
      project: link

  topic:                  # anything else worth writing down about my projects and setup
    folder: topics
    origin: internal
    role: synthesis

  source:                 # external material about agent tooling, cited by designs
    folder: sources
    origin: external
    original: immutable
    text: extracted
    quotes: verbatim
    role: input
    tracked: refresh
    refresh: never
    keys:
      kind: [webpage, blog-post, docs, pdf, video, repo, social-post]
      author: list
      url: string
      issued: date
      accessed: date
      source_note: string
    required: [kind]
