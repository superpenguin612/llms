[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kb"
version = "0.1.0"
description = "Knowledge-base CLI for agent-queryable, Obsidian-browsable vaults"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
capture = ["trafilatura>=2.3", "pymupdf>=1.24", "markitdown"]

[project.scripts]
kb = "kb.cli:main"

[tool.setuptools.packages.find]
include = ["kb*"]

[tool.setuptools.package-data]
kb = ["templates/**/*"]
